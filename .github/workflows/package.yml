name: Build and Package

on:
  workflow_dispatch: {}
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  # Vendors bc7enc_rdo at the pinned commit (with patches) once, so every native
  # build compiles exactly the same sources.
  vendor:
    name: Fetch bc7enc_rdo sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run fetch.sh
        working-directory: native/vendor/bc7enc_rdo
        run: |
          chmod +x fetch.sh
          ./fetch.sh
      - uses: actions/upload-artifact@v5
        with:
          name: bc7enc-vendor
          path: native/vendor/bc7enc_rdo/
          if-no-files-found: error

  natives-linux:
    name: Native bridge (linux x86_64 + aarch64)
    needs: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bc7enc-vendor
          path: native/vendor/bc7enc_rdo
      # Only for the JNI headers (jni.h); build-linux.sh mounts $JAVA_HOME/include.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Ubuntu 20.04 container (glibc 2.31 toolchain, binaries need glibc >= 2.17),
      # aarch64 cross-compiled.
      - name: Build with Docker
        run: |
          chmod +x native/build-linux.sh
          ./native/build-linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: natives-linux
          path: natives/linux/
          if-no-files-found: error

  natives-windows:
    name: Native bridge (windows x86_64)
    needs: vendor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bc7enc-vendor
          path: native/vendor/bc7enc_rdo
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build with CMake + MSVC
        shell: bash
        run: |
          cmake -S native -B build-native/windows -A x64
          cmake --build build-native/windows --config Release
          mkdir -p natives/windows/x86_64
          cp build-native/windows/Release/tessera_bridge.dll natives/windows/x86_64/
      - uses: actions/upload-artifact@v5
        with:
          name: natives-windows
          path: natives/windows/
          if-no-files-found: error

  package:
    name: Package JAR with natives
    needs: [natives-linux, natives-windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tessera
    steps:
      # settings.gradle.kts needs ../panzer-build-logic (includeBuild + common TOML),
      # so both repos are checked out side by side under the workspace.
      - uses: actions/checkout@v5
        with:
          path: Tessera
      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          path: panzer-build-logic

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v5
        with:
          name: natives-linux
          path: Tessera/natives/linux
      - uses: actions/download-artifact@v5
        with:
          name: natives-windows
          path: Tessera/natives/windows

      # Celeris resolves from https://panzerdevorg.github.io/Celeris/maven, so the
      # Celeris version in mod.stonecutter.properties.toml must have been released
      # (tagged) first. strict: every bundled platform's native must be present.
      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndCollect -Ptessera.native.strict=true --no-watch-fs --stacktrace

      - name: Verify JAR contains all natives
        run: |
          set -euo pipefail
          JAR_PATH=$(find build/libs -mindepth 2 -maxdepth 2 -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-dev.jar" | sort | head -n1)
          [ -n "$JAR_PATH" ] || { echo "::error::No mod JAR under build/libs/<version>/"; find build/libs -type f; exit 1; }
          echo "Inspecting $JAR_PATH"
          for plat in linux-x86_64 linux-aarch64 windows-x86_64; do
            unzip -l "$JAR_PATH" | grep -q "natives/$plat/" || { echo "::error::Missing natives for $plat in $JAR_PATH"; exit 1; }
          done

      - uses: actions/upload-artifact@v5
        with:
          name: tessera-jar
          path: Tessera/build/libs/**/*.jar
          if-no-files-found: error

  release:
    # Uploads the jar to Modrinth and CurseForge on v* tags.
    # Configure once per repository (Settings > Secrets and variables > Actions):
    #   variables: MODRINTH_ID, CURSEFORGE_ID   (project IDs; a missing one skips that site)
    #   secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
    # Game versions, loader and the Celeris dependency are read from the jar's
    # neoforge.mods.toml (Celeris must be published on both sites first).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Refuse to release if the tag disagrees with [mod] version.
      - name: Check tag matches mod version
        run: |
          MOD_VERSION=$(sed -n '/^\[mod\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' mod.stonecutter.properties.toml)
          [ "v$MOD_VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME != mod version $MOD_VERSION"; exit 1; }

      - uses: actions/download-artifact@v5
        with:
          name: tessera-jar
          path: jars

      - name: Locate jar
        id: jar
        run: |
          JAR=$(find jars -name "tessera-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | sort | head -n1)
          [ -n "$JAR" ] || { echo "::error::No Tessera jar"; find jars -type f; exit 1; }
          MC=$(basename "$JAR" .jar); MC=${MC##*+}
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}+$MC" >> "$GITHUB_OUTPUT"

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: Tessera ${{ steps.jar.outputs.version }}
          version: ${{ steps.jar.outputs.version }}
          loaders: neoforge
          changelog: See https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
