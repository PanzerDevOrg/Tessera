name: Build and Package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Release dry run: build, check and preview only (on a tag ref, untick to publish)"
        type: boolean
        default: true
      targets:
        description: "Release targets"
        type: string
        default: github,modrinth,curseforge
  push:
    branches: [master]
    tags: ["v*"]
    # Docs-only commits don't rebuild anything (path filters never apply to tag
    # pushes, so releases always run). The Modrinth page has its own workflow.
    paths-ignore: ["docs/**", "**.md", "LICENSE*", ".gitignore"]
  pull_request:
    # Docs-only commits don't rebuild anything (path filters never apply to tag
    # pushes, so releases always run). The Modrinth page has its own workflow.
    paths-ignore: ["docs/**", "**.md", "LICENSE*", ".gitignore"]

jobs:
  # Vendors bc7enc_rdo at the pinned commit (with patches) once, so every native
  # build compiles exactly the same sources.
  vendor:
    name: Fetch bc7enc_rdo sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run fetch.sh
        working-directory: native/vendor/bc7enc_rdo
        run: |
          chmod +x fetch.sh
          ./fetch.sh
      - uses: actions/upload-artifact@v5
        with:
          name: bc7enc-vendor
          path: native/vendor/bc7enc_rdo/
          if-no-files-found: error

  natives-linux:
    name: Native bridge (linux x86_64 + aarch64)
    needs: vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bc7enc-vendor
          path: native/vendor/bc7enc_rdo
      # Only for the JNI headers (jni.h); build-linux.sh mounts $JAVA_HOME/include.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Ubuntu 20.04 container (glibc 2.31 toolchain, binaries need glibc >= 2.17),
      # aarch64 cross-compiled.
      - name: Build with Docker
        run: |
          chmod +x native/build-linux.sh
          ./native/build-linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: natives-linux
          path: natives/linux/
          if-no-files-found: error

  natives-windows:
    name: Native bridge (windows x86_64)
    needs: vendor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bc7enc-vendor
          path: native/vendor/bc7enc_rdo
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build with CMake + MSVC
        shell: bash
        run: |
          cmake -S native -B build-native/windows -A x64
          cmake --build build-native/windows --config Release
          mkdir -p natives/windows/x86_64
          cp build-native/windows/Release/tessera_bridge.dll natives/windows/x86_64/
      - uses: actions/upload-artifact@v5
        with:
          name: natives-windows
          path: natives/windows/
          if-no-files-found: error

  package:
    name: Package JAR with natives
    needs: [natives-linux, natives-windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tessera
    steps:
      # settings.gradle.kts needs ../panzer-build-logic (includeBuild + common TOML),
      # so both repos are checked out side by side under the workspace.
      - uses: actions/checkout@v5
        with:
          path: Tessera
      - uses: actions/checkout@v5
        with:
          repository: PanzerDevOrg/PanzerBuildLogic
          path: panzer-build-logic

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v5
        with:
          name: natives-linux
          path: Tessera/natives/linux
      - uses: actions/download-artifact@v5
        with:
          name: natives-windows
          path: Tessera/natives/windows

      # Celeris resolves from https://panzerdevorg.github.io/Celeris/maven, so the
      # Celeris version in mod.stonecutter.properties.toml must have been released
      # (tagged) first. strict: every bundled platform's native must be present.
      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndCollect -Ptessera.native.strict=true --no-watch-fs --stacktrace

      # buildAndCollect writes the universal jar, the per-system jars
      # ([publish] platforms) and the sources jar.
      - name: Verify jars and their natives
        run: |
          set -euo pipefail
          natives() { unzip -Z1 "$1" | sed -n 's#^natives/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' '; }
          for JAR in $(find build/libs -mindepth 2 -maxdepth 2 -name "*.jar" | grep -Ev -- '-(sources|dev|windows|linux|macos|java)\.jar$'); do
            BASE=${JAR%.jar}
            for plat in linux-x86_64 linux-aarch64 windows-x86_64; do
              unzip -Z1 "$JAR" | grep -q "^natives/$plat/" || { echo "::error::$JAR lacks natives for $plat"; exit 1; }
            done
            for os in windows linux; do
              OTHER=$(natives "$BASE-$os.jar" | tr ' ' '\n' | grep -v "^$os-" | grep -v '^$' || true)
              [ -z "$OTHER" ] || { echo "::error::$BASE-$os.jar contains foreign natives: $OTHER"; exit 1; }
              [ -n "$(natives "$BASE-$os.jar")" ] || { echo "::error::$BASE-$os.jar has no natives"; exit 1; }
            done
            [ -z "$(natives "$BASE-java.jar")" ] || { echo "::error::$BASE-java.jar contains natives"; exit 1; }
            [ -f "$BASE-sources.jar" ] || { echo "::error::missing $BASE-sources.jar"; exit 1; }
            echo "ok: $(basename "$JAR") (+ windows/linux/java/sources)"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: tessera-jars
          path: Tessera/build/libs/
          if-no-files-found: error

  release:
    # GitHub release (universal + per-system + sources jars), Modrinth and
    # CurseForge, through panzer-build-logic's shared publisher. Every push is
    # a dry run that uploads a "release-preview" artifact (pages and files as
    # they would be published); only a v* tag publishes for real.
    # Secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN. Project ids: [publish] in the TOML.
    needs: package
    uses: PanzerDevOrg/PanzerBuildLogic/.github/workflows/mod-release.yml@master
    with:
      jars-artifact: tessera-jars
      dry-run: ${{ !(startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
      targets: ${{ inputs.targets || 'github,modrinth,curseforge' }}
    secrets: inherit
    permissions:
      contents: write
