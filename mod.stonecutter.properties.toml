# Tessera build configuration. Merged at configuration time with
# ../panzer-build-logic/common.stonecutter.properties.toml (panzer.settings):
# any table declared here replaces the common table of the same name.

# No [jvm.modules.*] tables: Tessera needs no preview features or extra modules.
# Native access goes through JNI (works on every JDK without flags), and SIMD
# math goes through Celeris's VectorOperations facade, which falls back to
# scalar code when jdk.incubator.vector is not enabled.

[mod]
id = "tessera"
name = "Tessera"
group = "com.panzer.mods"
package = "com.panzer.mods.tessera"
version = "0.2.0"
authors = "Bichal"
description = "Tessera: live BC7/BC1 atlas compression for low-end and integrated GPU hardware."
side = "CLIENT"
issues = "https://github.com/PanzerDevOrg/Tessera/issues"
banner = ""

# Celeris is both a compile dependency and a required runtime mod (declared in
# neoforge.mods.toml). panzer-build-logic resolves `artifact` ({mc} = the
# Minecraft version being built) from mavenLocal() first, then from `maven`.
# version: artifact version compiled against.
# version_range: versions NeoForge accepts at runtime.
# (No end-of-line comments: the build's TOML readers do not strip them.)
[depends_on.celeris]
version = "0.1.0"
version_range = "[0.1.0,)"
artifact = "com.panzer.mods:celeris-{mc}"
maven = "https://panzerdevorg.github.io/Celeris/maven"
repo = "PanzerDevOrg/Celeris"

# JNI bridge (native/, CMake), staged from natives/<os>/<arch>/ into the jar.
# No macOS: OpenGL 4.1 there has no BC7. Other platforms use the pure-Java
# encoder. CI (panzer-build-logic mod-ci.yml): ci_prepare vendors bc7enc_rdo
# before every native build; ci_linux_script builds both Linux platforms in
# one Ubuntu 20.04 container (binaries load on glibc 2.17+), Windows uses CMake.
[natives.tessera_bridge]
cmake_dir = "native"
platforms = ["windows-x86_64", "linux-x86_64", "linux-aarch64"]
ci_prepare = "native/vendor/bc7enc_rdo/fetch.sh"
ci_linux_script = "native/build-linux.sh"

# Third-party code inside the jar (ids from panzer-build-logic/legal/catalog.toml).
[legal.third_party]
components = ["bc7enc_rdo"]

# Releases and descriptions (panzer-build-logic/publishing). README.md is the
# description on GitHub, Modrinth and CurseForge. Per-system jars (only that
# OS's natives; "java" = none) are attached to GitHub releases only.
[publish]
modrinth_id = "olpctCIW"
curseforge_id = "1643537"
curseforge_slug = "tessera"
platforms = ["windows", "linux", "java"]
client_side = "required"
server_side = "unsupported"

# github: README links to that repository become Celeris's page on each site.
[publish.dependencies.celeris]
type = "required"
modrinth = "sQphaM3I"
curseforge = "celeris"
github = "PanzerDevOrg/Celeris"

[stonecutter]
versions = ["1.21.1"]
vcs_version = "1.21.1"

[compression]
# BC7 quality preset 0-7 used by dev runs (tessera.compression.defaultQualityPreset).
default_quality_preset = 3

# Pinned per mod: the exact NeoForge build Tessera is tested against, which
# overrides the shared ["1.21.1"] block in the common TOML.
["1.21.1"]
minecraft_version = "1.21.1"
minecraft_version_range = "[1.21.1,1.21.2)"
neo_version = "21.1.209"
neo_version_range = "[21.1,21.2)"
parchment_mappings_version = "2024.11.17"
game_versions = ["1.21.1"]
