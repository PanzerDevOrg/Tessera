[package]
name = "tessera-bridge"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "tessera_bridge"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
blake3 = "1.8.6"

[build-dependencies]
cc = "1.4.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
