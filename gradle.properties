# -Xmx4G: 2G is tight once Stonecutter is running several Minecraft-version
# subprojects plus NeoForge/ModDev's own tooling in the same daemon; raise this
# further (in ~/.gradle/gradle.properties, not here) for mods with many versions
# or many optional JVM modules.
# -XX:+UseParallelGC: throughput-oriented GC for a short-lived, CPU-bound daemon
# process (Gradle build JVM) beats the default G1 for this workload -- G1 optimizes
# for low pause times, which isn't what a build needs; it needs raw throughput.
# -XX:TieredStopAtLevel=1: skips C2 JIT compilation. The Gradle daemon process
# rarely runs any single piece of code long enough for C2's aggressive optimization
# to pay for itself, so staying at C1 (faster warm-up, less compilation overhead)
# is a net win for build wall-clock time.
org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Explicit even though it's the default since Gradle 6.5+: file-system watching
# lets the daemon skip re-scanning unchanged directories between builds.
org.gradle.vfs.watch=true
# org.gradle.workers.max is intentionally left unset here: it defaults to the
# machine's available processor count, which is the right call on a shared
# template consumed by different machines. Override it per-machine in the
# user-level gradle.properties (~/.gradle/gradle.properties), not here.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Only used when this mod has no sibling "../panzer-build-logic" checkout (see
# settings.gradle.kts's pluginManagement block) -- the version of panzer-build-logic
# to pull from its published, unauthenticated Maven repo. sync-mod.sh overwrites this
# whole file from this template, so bumping it here and re-running sync-mod.sh on each
# mod is how every consumer picks up a new panzer-build-logic release at once.
panzerBuildLogicVersion=0.1.0
